<!-- આલ્બમ સેક્શન (નવું સુધારેલું) -->
<div class="section-title">📸 કસ્ટમ ફોટો આલ્બમ સેટઅપ</div>
<div class="form-group">
  <label>આલ્બમ ટાઇપ / ક્વોલિટી:</label>
  <select id="albumType">
    <option value="Glossy">Glossy Album</option>
    <option value="Matt">Matt Album</option>
    <option value="Velvet">Velvet Album</option>
    <option value="Metallic">Metallic Album</option>
    <option value="Non-Tearable HD">Non-Tearable HD Album</option>
  </select>
</div>

<div class="form-row">
  <div class="form-group">
    <label>સીટની સંખ્યા (Total Sheets):</label>
    <input type="number" id="albumSheets" placeholder="દા.ત. 30" oninput="calculateAlbumTotal()">
  </div>
  <div class="form-group">
    <label>પર સીટ ભાવ (Rate Per Sheet ₹):</label>
    <input type="number" id="sheetRate" placeholder="દા.ત. 400" oninput="calculateAlbumTotal()">
  </div>
</div>

<div class="form-group">
  <label>કુલ ફોટાની અંદાજિત સંખ્યા (અંગત નોંધ માટે):</label>
  <input type="text" id="photoCount" placeholder="દા.ત. 250 ફોટા (10-30 સીટ)">
</div>

<div class="form-group">
  <label>આલ્બમનું કુલ બિલ (₹):</label>
  <input type="number" id="albumTotal" readonly placeholder="ઓટોમેટિક ગણતરી થશે">
</div>

<!-- વિડીયો શૂટિંગ સેક્શન (કલાક પ્રમાણે) -->
<div class="section-title">🎥 વિડીયો શૂટિંગ (કલાક પ્રમાણે ભાવ)</div>
<div class="form-row">
  <div class="form-group">
    <label>કુલ કલાક (Hours):</label>
    <input type="number" id="videoHours" placeholder="દા.ત. 2" oninput="calculateVideoTotal()">
  </div>
  <div class="form-group">
    <label>પર કલાક ભાવ (Rate Per Hour ₹):</label>
    <input type="number" id="videoRate" placeholder="દા.ત. 8000" oninput="calculateVideoTotal()">
  </div>
</div>

<div class="form-group">
  <label>વિડીયો શૂટિંગનું કુલ બિલ (₹):</label>
  <input type="number" id="videoTotal" readonly placeholder="ઓટોમેટિક ગણતરી થશે">
</div>

<script>
// આલ્બમ ગણતરી ફંકશન
function calculateAlbumTotal() {
  let sheets = parseFloat(document.getElementById('albumSheets').value) || 0;
  let rate = parseFloat(document.getElementById('sheetRate').value) || 0;
  document.getElementById('albumTotal').value = sheets * rate;
}

// વિડીયો ગણતરી ફંકશન
function calculateVideoTotal() {
  let hours = parseFloat(document.getElementById('videoHours').value) || 0;
  let rate = parseFloat(document.getElementById('videoRate').value) || 0;
  document.getElementById('videoTotal').value = hours * rate;
}
</script>
